name: Website

# Publishes site/ (the NumpadControl landing page) to GitHub Pages:
# https://youssefahmed2017.github.io/numpad-control/
# The app screenshots in docs/screenshots/ are copied into the site while it is built (site/img/screenshots/),
# so there is one copy of each picture in the repository.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Copy the app screenshots into the site
        run: mkdir -p site/img/screenshots && cp docs/screenshots/*.png site/img/screenshots/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
