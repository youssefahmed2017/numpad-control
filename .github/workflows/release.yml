name: Release

# To release: set __version__ in numpadctl/__init__.py (e.g. "0.2.0"), commit, then push
# the matching tag (git tag v0.2.0 && git push --tags). This publishes the release with
# notes generated from the commits since the last one, and installed copies update to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches numpadctl.__version__ (installed copies compare them to update)
        run: |
          version=$(python3 -c "import numpadctl; print(numpadctl.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ = $version in numpadctl/__init__.py" >&2
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "NumpadPilot $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  windows-installer:
    # The installer winget points at: built here and attached to the release made above.
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1
      - run: |
          $setup = (Get-ChildItem build\windows -Filter "NumpadPilot-Setup-*.exe").FullName
          powershell -ExecutionPolicy Bypass -File packaging\windows\smoke-test.ps1 $setup
          gh release upload "$env:GITHUB_REF_NAME" $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256 of $setup is $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}
