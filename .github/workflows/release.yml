name: Release

# To release, run `tools/release 1.2.3 --key KEYFILE` on your own computer: it sets __version__,
# checks CI is green, pushes the tag, waits for this workflow and signs the release. This workflow
# publishes the release (notes from the commits since the last one), builds the Windows installer
# and then, when the secrets below exist, submits the winget update (Komac) and updates the AUR
# package. Installed copies update only to a release that is also signed: the private key never
# goes in CI, so the signing step (tools/sign-release, run by tools/release) is the one human step.
#
# Optional secrets (a job is skipped when its secret is missing):
#   WINGET_TOKEN  a classic personal access token with public_repo, so Komac can fork winget-pkgs
#   AUR_SSH_KEY   the private SSH key of the AUR account that maintains numpad-control
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches numpadctl.__version__ (installed copies compare them to update)
        run: |
          version=$(python3 -c "import numpadctl; print(numpadctl.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ = $version in numpadctl/__init__.py" >&2
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "NumpadControl $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  windows-installer:
    # The installer winget points at: built here and attached to the release made above.
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1
      - run: |
          $setup = (Get-ChildItem build\windows -Filter "NumpadControl-Setup-*.exe").FullName
          powershell -ExecutionPolicy Bypass -File packaging\windows\smoke-test.ps1 $setup
          gh release upload "$env:GITHUB_REF_NAME" $setup
          # Copies older than 0.3.0 look for the Setup under its old name; same file, same hash, so their update still works.
          $legacy = Join-Path (Split-Path $setup) (Split-Path $setup -Leaf).Replace("NumpadControl-Setup", "NumpadPilot-Setup")
          Copy-Item $setup $legacy
          gh release upload "$env:GITHUB_REF_NAME" $legacy
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256 of $setup is $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

  winget:
    # A new version of a package that is already in winget: Komac copies the previous manifest, changes the
    # version, URL and hash, and opens the pull request in microsoft/winget-pkgs. The first version of a
    # package is submitted by hand, so this fails (harmlessly) until that has been merged.
    needs: windows-installer
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      KOMAC_VERSION: "2.17.2"
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget with Komac
        if: env.WINGET_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          ./komac update YoussefAhmed.NumpadControl --version "$version" \
            --urls "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/NumpadControl-Setup-${version}.exe" \
            --submit
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}

  aur:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
        if: env.AUR_SSH_KEY != ''
      - name: Point the recipe at this release
        if: env.AUR_SSH_KEY != ''
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - name: Publish to the AUR (updates the checksum, builds once to check it, pushes)
        if: env.AUR_SSH_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: numpad-control
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/numpad-control.install
          updpkgsums: true
          test: true
          commit_username: Youssef Ahmed
          commit_email: 245279337+youssefahmed2017@users.noreply.github.com
          ssh_private_key: ${{ env.AUR_SSH_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
