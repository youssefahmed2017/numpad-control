name: Docs screenshots

# Keeps the pictures in the README and docs current. When a push changes the settings window's code
# (numpadctl_ui/), this renders the window offscreen with tools/docs-screenshots.py and, if a picture
# came out different, commits it to main. The README shows docs/screenshots/macro.png, so it updates
# with it, and the website (docs.html) shows the same pictures. The commit is made with the workflow's own
# token, which doesn't start other workflows, so the Website workflow is started by hand below; the commit only
# touches docs/screenshots/, which isn't in the paths here, so this can't loop.
on:
  push:
    branches: [main]
    paths: ["numpadctl_ui/**", "tools/docs-screenshots.py", ".github/workflows/docs-screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: docs-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt's libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - name: Render the screenshots
        run: python tools/docs-screenshots.py docs/screenshots
      - name: Commit the ones that changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git status --porcelain docs/screenshots | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots
            git commit -m "Update the docs screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          else
            echo "The screenshots are up to date."
          fi
