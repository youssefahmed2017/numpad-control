name: Installer preview

# By hand: builds the Windows installer, runs its wizard and uploads a screenshot of every page.
on: workflow_dispatch

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1
      - run: |
          $setup = (Get-ChildItem build\windows -Filter "NumpadPilot-Setup-*.exe").FullName
          powershell -ExecutionPolicy Bypass -File packaging\windows\preview-wizard.ps1 $setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wizard-shots
          path: wizard-shots/*.png
