name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt's libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -s tests -t .
      - name: setup.sh menu and a dry run (Linux)
        if: runner.os == 'Linux'
        run: |
          bash setup.sh --update --dry-run --no-deps --yes
          bash install.sh --help | head -3
      - name: setup.ps1 menu and a dry run (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:NUMPAD_ACTION = "quit"
          .\setup.ps1
          Remove-Item Env:NUMPAD_ACTION
          .\setup.ps1 -Update -DryRun
